name: quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SENTRY_AUTH_TOKEN: ""
      SENTRY_ORG: ""
      SENTRY_PROJECT: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run audit
      - run: npm run lint
      - run: npm run typecheck -- --incremental false
      - run: npm test
      - run: npm run test:goldens
      - run: npm run test:eslint-rule
      - run: npm run build
